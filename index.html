<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KT 요금제 상담 AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 단순 채팅 화면: n8n 응답은 왼쪽, 직원 입력은 오른쪽. */
:root {
  color-scheme: light;
  --bg: #F1F2F4;
  --surface: #FFFFFF;
  --sunken: #F6F7F9;
  --ink: #15171C;
  --muted: #5B6270;
  --line: #DDE0E6;
  --accent: #E4002B;
  --on-accent: #FFFFFF;
  --user-bg: #1A1D24;
  --user-fg: #F4F5F7;
  --bad: #B3261E;
  --down: #0C7A55;
  --font-body: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1115; --surface: #181B21; --sunken: #1E222A; --ink: #ECEEF2; --muted: #98A0AE; --line: #2A2F39;
    --accent: #FF5470; --on-accent: #1A0409; --user-bg: #2B303B; --user-fg: #ECEEF2; --bad: #FF8A80; --down: #4FD3A2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1115; --surface: #181B21; --sunken: #1E222A; --ink: #ECEEF2; --muted: #98A0AE; --line: #2A2F39;
  --accent: #FF5470; --on-accent: #1A0409; --user-bg: #2B303B; --user-fg: #ECEEF2; --bad: #FF8A80; --down: #4FD3A2;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.55;
  padding: 12px 16px;
}
button, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.top-actions { display: flex; gap: 8px; }
.top-actions .btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.status { font-size: 13px; color: var(--muted); }
.label { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; color: var(--muted); }

/* 분석 기간 */
.period { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 12px; }
.period label { display: flex; flex-direction: column; gap: 4px; }
.period input { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 10px; font: inherit; font-size: 14px; color: inherit; font-variant-numeric: tabular-nums; }
.period input:invalid { border-color: var(--bad); }
.period .tilde { padding-bottom: 8px; color: var(--muted); }
.presets { display: flex; gap: 6px; flex-wrap: wrap; }
.presets .btn { padding: 7px 12px; }
.presets .btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.period-note { font-size: 12px; color: var(--muted); padding-bottom: 9px; }
.brand { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
.brand .kt { color: var(--accent); margin-right: 6px; letter-spacing: 0.02em; }

/* 상담 고객 선택: 예시 고객 4명 중 하나 */
.customers { border: 0; margin: 0; padding: 0; min-width: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.customers legend { padding: 0; margin-bottom: 6px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; color: var(--muted); }
.pick { position: relative; display: flex; flex-direction: column; gap: 2px; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; cursor: pointer; }
.pick input { position: absolute; opacity: 0; pointer-events: none; }
.pick .nm { font-weight: 700; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick .nm small { font-family: var(--font-mono); font-weight: 400; font-size: 11px; color: var(--muted); margin-left: 6px; }
.pick .rate { font-size: 13px; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick .why { font-size: 12px; color: var(--muted); line-height: 1.4; }
.pick:hover { border-color: var(--accent); }
.pick:has(input:checked) { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.pick:has(input:checked) .nm { color: var(--accent); }
.pick:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.pick:has(input:disabled) { cursor: not-allowed; opacity: 0.55; }
.pick:has(input:checked:disabled) { opacity: 1; }

/* 본문: 왼쪽 고객 정보, 오른쪽 채팅 */
.work { flex: 1; min-height: 0; display: grid; grid-template-columns: 264px minmax(0, 1fr); gap: 12px; }
.cust { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; overflow-y: auto; min-width: 0; }
.cust summary { list-style: none; cursor: default; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.cust summary::-webkit-details-marker { display: none; }
.cust .s-mob { display: none; }
.cust-body { display: flex; flex-direction: column; gap: 16px; margin-top: 12px; }
.consent { font-size: 13px; color: var(--muted); margin: 0; }
.who-name { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.2; }
.who-meta { font-size: 13px; color: var(--muted); margin-top: 2px; }
.field-label { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.plan-name { font-weight: 700; }
.plan-price { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.scope { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; font-size: 14px; }
.scope li { display: flex; align-items: center; gap: 8px; }
.scope svg { flex: 0 0 auto; }
.scope.excluded { color: var(--muted); }
.sample-note { font-size: 12px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; margin: 0; }

.chat { min-height: 0; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; }
.feed { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 16px; }

.row { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.row.user { align-items: flex-end; }
.row.ai { align-items: flex-start; }
.who { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.05em; color: var(--muted); }
.bubble { padding: 10px 14px; max-width: min(640px, 92%); min-width: 0; overflow-wrap: anywhere; }
.user .bubble { background: var(--user-bg); color: var(--user-fg); border-radius: 14px 14px 4px 14px; white-space: pre-wrap; }
.ai .bubble { background: var(--sunken); border: 1px solid var(--line); border-radius: 14px 14px 14px 4px; }
.ai .bubble.err { border-color: var(--bad); }
.err-title { color: var(--bad); font-weight: 700; margin: 0 0 4px; }

.composer { border-top: 1px solid var(--line); padding: 10px 14px 14px; }
.composer form { display: flex; gap: 8px; align-items: flex-end; }
.composer textarea { flex: 1; min-width: 0; resize: none; max-height: 160px; border: 1px solid var(--line); background: var(--sunken); border-radius: 8px; padding: 10px 12px; line-height: 1.45; }
.composer textarea::placeholder { color: var(--muted); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; font-size: 14px; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); padding: 10px 16px; }
.btn:disabled, .composer textarea:disabled { opacity: 0.55; cursor: not-allowed; }
.btn.mkt { padding: 10px 12px; white-space: nowrap; }
.btn.mkt[aria-pressed="true"] { background: var(--sunken); border-color: var(--accent); color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.tag { display: inline-block; margin-left: 6px; padding: 0 6px; border: 1px solid var(--accent); border-radius: 999px; color: var(--accent); font-family: var(--font-body); font-size: 11px; letter-spacing: 0; }
.hint { font-size: 12px; color: var(--muted); margin-top: 6px; }

.dots { display: flex; gap: 5px; padding: 6px 0; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.1s ease-in-out infinite; }
.dots i:nth-child(2) { animation-delay: 0.15s; }
.dots i:nth-child(3) { animation-delay: 0.3s; }
@keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .dots i { animation: none; opacity: 0.6; } }

/* 마크다운 응답 */
.md { display: flex; flex-direction: column; gap: 8px; }
.md p { margin: 0; }
.md h4 { margin: 6px 0 0; font-size: 15px; }
.md ul, .md ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 2px; }
.md blockquote { margin: 0; padding: 8px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; color: var(--muted); }
.md code { font-family: var(--font-mono); font-size: 13px; background: var(--surface); padding: 0 4px; border-radius: 4px; }
.md li > ul { margin-top: 2px; }
.md hr { border: 0; border-top: 1px solid var(--line); width: 100%; margin: 4px 0; }
.md pre.code { margin: 0; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.5; }
.md img { max-width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--line); background: #fff; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--line); vertical-align: top; }
thead th { font-weight: 700; }

@media (max-width: 860px) {
  .work { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .cust { padding: 10px 14px; overflow: visible; }
  .cust summary { cursor: pointer; display: flex; justify-content: space-between; align-items: center; text-transform: none; letter-spacing: 0; font-family: var(--font-body); font-size: 13px; color: var(--ink); }
  .cust summary::after { content: '▾'; color: var(--muted); }
  .cust[open] summary::after { content: '▴'; }
  .cust .s-desk { display: none; }
  .cust .s-mob { display: inline; }
  .cust-body { max-height: 46vh; overflow-y: auto; }
}
@media (max-width: 600px) {
  .customers { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .feed { padding: 14px; }
  .hint { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="kt">KT</span>요금제 상담 AI</div>
    <div class="top-actions">
      <button class="btn" type="button" id="streamBtn" aria-pressed="true" title="켜면 답을 생성되는 대로 보여줍니다. 끄면 다 만든 뒤 한 번에 받습니다(약 100초 넘는 답은 실패)">스트리밍</button>
      <button class="btn" type="button" id="ops" disabled title="준비 중: 운영 워크플로우(별도 Webhook)를 새 탭으로 엽니다">운영</button>
      <button class="btn" type="button" id="reset">새 대화</button>
    </div>
  </header>

  <div class="period" role="group" aria-label="분석 기간">
    <label><span class="label">시작일</span><input type="date" id="from" required></label>
    <span class="tilde">~</span>
    <label><span class="label">종료일</span><input type="date" id="to" required></label>
    <div class="presets" id="presets">
      <button class="btn" type="button" data-months="1">1개월</button>
      <button class="btn" type="button" data-months="3">3개월</button>
      <button class="btn" type="button" data-months="6">6개월</button>
      <button class="btn" type="button" data-months="12">12개월</button>
    </div>
    <span class="period-note" id="periodNote"></span>
  </div>

  <fieldset class="customers" id="customers">
    <legend class="label">상담 고객</legend>
  </fieldset>

  <main class="work">
  <details class="cust" id="cust">
    <summary><span class="s-desk">분석용 고객 정보</span><span class="s-mob" id="custMob"></span></summary>
    <div class="cust-body">
      <p class="consent">고객 동의 범위 안의 최소 정보만 사용합니다.</p>
      <div>
        <div class="who-name" id="custName"></div>
        <div class="who-meta" id="custMeta"></div>
      </div>
      <div>
        <div class="field-label">현재 상품</div>
        <div class="plan-name" id="custPlan"></div>
        <div class="plan-price" id="custPrice"></div>
      </div>
      <div>
        <div class="field-label">선택 부가서비스</div>
        <div class="plan-price" id="custSvc"></div>
      </div>
      <div>
        <div class="field-label">월평균 데이터 사용량</div>
        <div class="plan-price" id="custUsage"></div>
      </div>
      <div>
        <div class="field-label">분석 범위</div>
        <ul class="scope">
          <li><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="var(--down)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>요금제 정보</li>
          <li><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="var(--down)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>데이터 이용량</li>
          <li><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="var(--down)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>콘텐츠 이용 유형</li>
          <li><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="var(--down)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>결합·할인 정보</li>
        </ul>
      </div>
      <div>
        <div class="field-label">분석에 쓰지 않음</div>
        <ul class="scope excluded">
          <li><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 8h8" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round"/></svg>이름 · 연락처 · 주소</li>
        </ul>
      </div>
      <p class="sample-note">왼쪽 고객 정보는 2026-10-02에 조회한 값입니다. 답변 내용은 n8n 워크플로우가 돌려준 결과입니다.</p>
    </div>
  </details>

  <section class="chat" aria-label="AI 상담 채팅">
    <div class="feed" id="feed" role="log" aria-live="polite"></div>
    <div class="composer">
      <form id="form" autocomplete="off">
        <textarea id="msg" rows="1" placeholder="메시지를 입력하세요" aria-label="메시지 입력"></textarea>
        <button class="btn mkt" type="button" id="mkt" aria-pressed="false" title="다음 메시지 한 번만 마케팅 메시지 생성 Agent로 보냅니다">마케팅</button>
        <button class="btn primary" type="submit" id="send">전송</button>
      </form>
      <div class="hint" id="hint">Enter 전송 · Shift+Enter 줄바꿈 · 분석에 1~2분 걸릴 수 있습니다</div>
    </div>
  </section>
  </main>
</div>

<script>
(function () {
  'use strict';

  var CONFIG = {
    chatUrl: '/api/chat',   // server.js가 n8n(CHAT_URL)으로 전달합니다. file://로 열면 동작하지 않으니 npm start로 실행하세요
    timeoutMs: 120000,       // 한 번에 받기: n8n Cloud가 약 100초에서 끊으므로 그보다 길게 기다려도 소용없습니다
    streamTimeoutMs: 600000, // 스트리밍: 마케팅 보고서는 3분 넘게 걸리기도 합니다
    stream: true,            // 기본값. 헤더의 스트리밍 버튼으로 바꾸며, 이 브라우저에 기억됩니다
    opsUrl: '',             // 운영 워크플로우(별도 Webhook) 주소. 비어 있으면 운영 버튼이 꺼진 채로 둡니다
    // 예시 고객 4명. id는 개인화 카탈로그의 user_id로 n8n에 그대로 전달됩니다. 첫 번째 고객이 기본 선택입니다
    // 2026-10-02 ai_personalization 뷰 조회 값. 월평균은 2026-04~09 (완전한 6개월) 기준입니다
    users: [
      { id: 'U00603', name: '김수서', plan: '초이스90', fee: 90000, data: '무제한 · 5G',
        services: ['티빙 스탠다드'], meta: '결합 없음 · KT 인터넷 없음', avgGb: 176.8,
        reason: '적정 유지 확인 · 월 176.8GB 헤비 유저, 티빙 실사용' },
      { id: 'U09832', name: '윤서준', plan: '베이직21GB(이월)', fee: 58000, data: '월 21GB · LTE/5G',
        services: [], meta: '가족 정보 없음', avgGb: 71.1,
        reason: '업셀 후보 · 제공 21GB에 월 71.1GB 사용' },
      { id: 'U09327', name: '임서윤', plan: '초이스130', fee: 130000, data: '무제한 · 5G',
        services: ['지니뮤직', '밀리의서재'], meta: '가족 정보 없음', avgGb: 5.2,
        reason: '다운셀 후보 · 최고가 무제한에 월 5.2GB 사용' },
      { id: 'U00864', name: '이현서', plan: '초이스 더블', fee: 120000, data: '무제한 · 5G',
        services: ['Disney+ 스탠다드', '단말보험 멤버십 할인'], meta: 'KT 인터넷 보유 · 결합 없음', avgGb: 163.2,
        reason: '결합 후보 · 인터넷 보유·미결합, Disney+ 사용 기록 없음' }
    ],
    dataStart: '2025-10-24', // 조회 가능한 가장 이른 날짜
    defaultMonths: 6         // 기본 기간: 오늘로 끝나는 6개월
  };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* 응답 본문(JSON, 또는 스트리밍 줄 단위 JSON)에서 답변 텍스트를 꺼냅니다. */
  function replyText(raw) {
    var t = String(raw).trim(), body;
    try { body = JSON.parse(t); } catch (e) {
      var acc = '', seen = false;
      t.split('\n').forEach(function (l) {
        try { var o = JSON.parse(l); if (o && o.type === 'item' && typeof o.content === 'string') { acc += o.content; seen = true; } } catch (e2) { /* 무시 */ }
      });
      return seen ? acc : t;
    }
    if (Array.isArray(body)) body = body[0];
    if (body && typeof body === 'object') {
      // Chat Trigger는 output, Webhook + Respond to Webhook은 reply로 돌려줍니다
      var out = body.output !== undefined ? body.output : body.reply !== undefined ? body.reply : body.text !== undefined ? body.text : body.message;
      if (out === undefined) return '```\n' + JSON.stringify(body, null, 2) + '\n```';
      return typeof out === 'string' ? out : '```\n' + JSON.stringify(out, null, 2) + '\n```';
    }
    return body == null ? '' : String(body);
  }

  /* Agent는 LLM을 부를 때마다 begin…end 구간을 하나씩 보냅니다. 마지막으로 글자가 나온 구간이 최종 답입니다.
     Respond to Webhook 노드가 같이 보내는 {reply} 조각은 Agent 글자가 없을 때만 씁니다. */
  function StreamState() { this.segs = []; this.steps = 0; this.error = ''; this.respond = ''; this.buf = ''; }
  StreamState.prototype.push = function (chunk) {
    var lines = (this.buf + chunk).split('\n');
    this.buf = lines.pop();
    for (var i = 0; i < lines.length; i++) this.line(lines[i]);
  };
  StreamState.prototype.line = function (l) {
    var o; try { o = JSON.parse(l); } catch (e) { return; }
    if (!o || typeof o !== 'object') return;
    var node = (o.metadata && o.metadata.nodeName) || '';
    if (o.type === 'error') { this.error = String(o.content || 'error'); return; }
    if (node === 'Respond to Webhook') { if (o.type === 'item') this.respond += o.content || ''; return; }
    if (o.type === 'begin') { this.steps++; this.segs.push(''); return; }
    if (o.type === 'item' && typeof o.content === 'string') {
      if (!this.segs.length) this.segs.push('');
      this.segs[this.segs.length - 1] += o.content;
    }
  };
  StreamState.prototype.text = function () {
    for (var i = this.segs.length - 1; i >= 0; i--) if (this.segs[i].trim()) return this.segs[i];
    return this.respond ? replyText(this.respond) : '';
  };

  /* 아주 작은 마크다운 렌더러. 입력은 항상 esc()를 거칩니다. */
  function cells(row) { return row.trim().replace(/^\||\|$/g, '').split('|').map(function (c) { return c.trim(); }); }
  function inline(s) {
    return s
      .replace(/!\[([^\]]*)\]\((https:\/\/[^\s)]+)\)/g, '<img src="$2" alt="$1" loading="lazy">')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  }
  function md(src) {
    var lines = String(src).replace(/\r/g, '').split('\n'), html = '', i = 0, list = null;
    function closeList() { if (list) { html += '</' + list + '>'; list = null; } }
    while (i < lines.length) {
      var ln = lines[i];
      if (/^```/.test(ln)) {
        closeList();
        var buf = []; i++;
        while (i < lines.length && !/^```/.test(lines[i])) { buf.push(lines[i]); i++; }
        i++;
        html += '<pre class="code">' + esc(buf.join('\n')) + '</pre>';
        continue;
      }
      if (/^\s*\|.*\|\s*$/.test(ln) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
        closeList();
        var head = cells(ln), rows = [];
        i += 2;
        while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) { rows.push(cells(lines[i])); i++; }
        html += '<div class="table-wrap"><table><thead><tr>' + head.map(function (c) { return '<th>' + inline(esc(c)) + '</th>'; }).join('') +
          '</tr></thead><tbody>' + rows.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + inline(esc(c)) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>';
        continue;
      }
      var h = ln.match(/^(#{1,4})\s+(.*)$/);
      if (h) { closeList(); html += '<h4>' + inline(esc(h[2])) + '</h4>'; i++; continue; }
      var ul = ln.match(/^\s*[-*]\s+(.*)$/), ol = ln.match(/^\s*\d+[.)]\s+(.*)$/);
      if (ul || ol) {
        var tag = ul ? 'ul' : 'ol';
        if (list !== tag) { closeList(); html += '<' + tag + '>'; list = tag; }
        html += '<li>' + inline(esc((ul || ol)[1]));
        i++;
        // 들여쓴 하위 항목은 한 단계 안쪽 목록으로 묶습니다
        var sub = [];
        while (i < lines.length && /^\s{2,}[-*]\s+/.test(lines[i])) { sub.push(lines[i].replace(/^\s*[-*]\s+/, '')); i++; }
        if (sub.length) html += '<ul>' + sub.map(function (s) { return '<li>' + inline(esc(s)) + '</li>'; }).join('') + '</ul>';
        html += '</li>'; continue;
      }
      closeList();
      if (/^\s*>/.test(ln)) {
        // 연속된 인용 줄은 하나의 상자로 묶고, 안쪽도 마크다운으로 그립니다
        var quote = [];
        while (i < lines.length && /^\s*>/.test(lines[i])) { quote.push(lines[i].replace(/^\s*>\s?/, '')); i++; }
        html += '<blockquote class="md">' + md(quote.join('\n')) + '</blockquote>';
        continue;
      }
      if (/^\s*(---+|\*\*\*+)\s*$/.test(ln)) { html += '<hr>'; i++; continue; }
      if (!ln.trim()) { i++; continue; }
      html += '<p>' + inline(esc(ln)) + '</p>'; i++;
    }
    closeList();
    return html;
  }

  /* ============ 화면 ============ */
  var $ = function (s) { return document.querySelector(s); };
  var feed = $('#feed'), msg = $('#msg'), form = $('#form'), sendBtn = $('#send'), picker = $('#customers');
  var fromIn = $('#from'), toIn = $('#to'), presets = $('#presets'), periodNote = $('#periodNote');
  var busy = false, curCtrl = null;
  // 고객마다 대화(n8n 메모리 세션)를 따로 둡니다. 고객을 바꿨다 돌아오면 이전 대화가 그대로 보입니다
  var user = CONFIG.users[0].id, convs = {};
  var stream = CONFIG.stream;
  try { var saved0 = localStorage.getItem('kt-chat-stream'); if (saved0 !== null) stream = saved0 === '1'; } catch (e) { /* 저장소를 못 쓰면 기본값 */ }
  var marketing = false;   // 다음 메시지 한 번만 마케팅 Agent로 보냅니다. 보내면 다시 꺼집니다
  function info(id) { return CONFIG.users.filter(function (u) { return u.id === id; })[0]; }
  function won(n) { return '월 ' + Number(n).toLocaleString('ko-KR') + '원'; }
  var DOTS = '<div class="dots" aria-label="응답 생성 중"><i></i><i></i><i></i></div>';

  function newId() { return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'sess-' + Date.now().toString(36) + Math.random().toString(36).slice(2); }
  function add(html) { feed.insertAdjacentHTML('beforeend', html); return feed.lastElementChild; }
  function userRow(t, mk) { return '<div class="row user"><div class="who">직원' + (mk ? '<span class="tag">마케팅 메시지</span>' : '') + '</div><div class="bubble">' + esc(t) + '</div></div>'; }
  function aiRow(inner) { return '<div class="row ai"><div class="who">AI</div><div class="bubble">' + inner + '</div></div>'; }
  function aiText(t) { return '<div class="md">' + (t.trim() ? md(t) : '<p>응답이 비어 있습니다. n8n의 Executions 탭에서 실행 기록을 확인해 보세요.</p>') + '</div>'; }
  function errorText(e, ms) {
    if (e && e.name === 'AbortError') return '응답이 ' + Math.round(ms / 1000) + '초 안에 오지 않아 중단했습니다. n8n의 Executions 탭에서 실행이 끝났는지 확인하세요.';
    if (e && e.message === 'HTTP 524') return 'n8n Cloud가 약 100초 안에 답을 받지 못해 연결을 끊었습니다. 오래 걸리는 질문은 스트리밍을 켜고 보내세요.';
    if (e && /^HTTP/.test(e.message || '')) return 'n8n이 오류(' + esc(e.message) + ')를 돌려줬습니다. Executions 탭에서 어느 노드에서 멈췄는지 확인하세요.';
    if (e && e.n8n) return /429|quota/i.test(e.n8n) ? 'AI 모델(Gemini) 사용 한도를 넘었습니다. 잠시 후 다시 시도하거나 API 키 한도를 확인하세요.'
      : 'n8n 실행 중 오류가 났습니다: ' + esc(e.n8n.slice(0, 300));
    return '서버에 연결하지 못했습니다. 잠시 후 다시 시도하세요.';
  }
  function scrollDown() { feed.scrollTop = feed.scrollHeight; }
  function lock(b) { busy = b; msg.disabled = b; sendBtn.disabled = b; picker.disabled = b; if (!b) msg.focus(); }
  function fit() { msg.style.height = 'auto'; msg.style.height = Math.min(msg.scrollHeight, 160) + 'px'; }

  function setMarketing(b) {
    marketing = b;
    $('#mkt').setAttribute('aria-pressed', b ? 'true' : 'false');
    $('#hint').textContent = b ? '다음 메시지 한 번만 마케팅 메시지 생성 Agent로 보냅니다 · 비워 두고 전송해도 됩니다'
      : 'Enter 전송 · Shift+Enter 줄바꿈 · 분석에 1~2분 걸릴 수 있습니다';
  }

  async function send(text, mk) {
    lock(true);
    setMarketing(false);
    msg.value = ''; fit();
    add(userRow(text, mk));
    var row = add(aiRow(DOTS)); scrollDown();
    var bubble = row.querySelector('.bubble');
    var ctrl = new AbortController(); curCtrl = ctrl;
    var streaming = stream, ms = streaming ? CONFIG.streamTimeoutMs : CONFIG.timeoutMs;
    var timer = setTimeout(function () { ctrl.abort(); }, ms);
    try {
      var res = await fetch(CONFIG.chatUrl + (streaming ? '?stream=1' : ''), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        // chatInput은 Chat Trigger용, userMessage는 Webhook 트리거용 필드입니다 (같은 값). n8n에서는 $json.userId로 읽습니다
        body: JSON.stringify({ action: 'sendMessage', sessionId: convs[user], chatInput: text, userMessage: text,
          userId: user, startDate: fromIn.value, endDate: toIn.value, marketing: mk }),
        signal: ctrl.signal
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var reply;
      if (streaming && res.body) {
        var st = new StreamState(), reader = res.body.getReader(), dec = new TextDecoder(), queued = false;
        var paint = function () {
          queued = false;
          if (curCtrl !== ctrl) return;
          var near = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 80;
          var t = st.text();
          bubble.innerHTML = t ? '<div class="md">' + md(t) + '</div>'
            : '<p class="status">데이터를 조회하고 있습니다' + (st.steps > 1 ? ' · ' + st.steps + '단계' : '') + '</p>' + DOTS;
          if (near) scrollDown();
        };
        for (;;) {
          var r = await reader.read();
          if (r.done) break;
          st.push(dec.decode(r.value, { stream: true }));
          if (!queued) { queued = true; requestAnimationFrame(paint); }
        }
        st.push(dec.decode() + '\n');
        if (st.error && !st.text()) throw Object.assign(new Error('n8n'), { n8n: st.error });
        reply = st.text();
      } else {
        reply = replyText(await res.text());
      }
      if (curCtrl !== ctrl) return;
      bubble.innerHTML = aiText(reply);
    } catch (e) {
      if (curCtrl !== ctrl) return;
      bubble.classList.add('err');
      bubble.innerHTML = '<p class="err-title">답변을 받지 못했습니다</p><p>' + errorText(e, ms) + '</p>';
    } finally {
      clearTimeout(timer);
      if (curCtrl === ctrl) { curCtrl = null; lock(false); }
    }
    row.scrollIntoView({ block: 'start' });
  }

  var saved = {};   // 고객별 화면 내용
  function reset() {
    if (curCtrl) { curCtrl.abort(); curCtrl = null; }
    convs[user] = newId();
    feed.innerHTML = '';
    add(aiRow(aiText('**' + info(user).name + '** (' + user + ') 고객을 선택했습니다. 무엇을 분석할까요?')));
    lock(false);
  }
  function pick(id) {
    if (busy || id === user) return;
    saved[user] = feed.innerHTML;
    user = id;
    showUser();
    if (saved[user]) { feed.innerHTML = saved[user]; scrollDown(); msg.focus(); }
    else reset();
  }

  picker.insertAdjacentHTML('beforeend', CONFIG.users.map(function (u, i) {
    return '<label class="pick"><input type="radio" name="cust" value="' + esc(u.id) + '"' + (i === 0 ? ' checked' : '') + '>' +
      '<span class="nm">' + esc(u.name) + '<small>' + esc(u.id) + '</small></span>' +
      '<span class="rate">' + esc(u.plan) + ' · ' + won(u.fee) + '</span>' +
      '<span class="why">' + esc(u.reason) + '</span></label>';
  }).join(''));
  picker.addEventListener('change', function (e) { pick(e.target.value); });
  function showUser() {
    var u = info(user);
    $('#custName').textContent = u.name;
    $('#custMeta').textContent = u.id + ' · ' + u.meta;
    $('#custPlan').textContent = u.plan;
    $('#custPrice').textContent = won(u.fee) + ' · ' + u.data;
    $('#custSvc').textContent = u.services.length ? u.services.join(' · ') : '없음';
    $('#custUsage').textContent = u.avgGb + 'GB (2026-04~09)';
    $('#custMob').textContent = u.name + ' · ' + u.plan;
  }
  showUser();
  // 넓은 화면에서는 고객 정보를 항상 펼치고, 좁은 화면에서는 접어 둡니다
  var custEl = $('#cust'), wide = window.matchMedia('(min-width: 861px)');
  function syncInfo() { custEl.open = wide.matches; }
  if (wide.addEventListener) wide.addEventListener('change', syncInfo);
  syncInfo();

  /* ---------- 분석 기간 ---------- */
  function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function minusMonths(s, n) {
    var p = s.split('-').map(Number), m = p[1] - 1 - n;
    var last = new Date(p[0], m + 1, 0).getDate();   // 3/31에서 1개월 전은 2/28(29)로 맞춥니다
    return iso(new Date(p[0], m, Math.min(p[2], last)));
  }
  var today = iso(new Date());
  function presetStart(n) { var s = minusMonths(today, n); return s < CONFIG.dataStart ? CONFIG.dataStart : s; }
  function syncPeriod() {
    fromIn.max = toIn.value || today;
    toIn.min = fromIn.value || CONFIG.dataStart;
    presets.querySelectorAll('[data-months]').forEach(function (b) {
      var on = toIn.value === today && fromIn.value === presetStart(Number(b.dataset.months));
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    var ok = fromIn.checkValidity() && toIn.checkValidity();
    periodNote.textContent = !ok ? CONFIG.dataStart + ' ~ ' + today + ' 사이에서 시작일이 종료일보다 앞서야 합니다'
      : fromIn.value === CONFIG.dataStart ? CONFIG.dataStart + '부터 데이터가 있습니다' : '';
  }
  function setMonths(n) { toIn.value = today; fromIn.value = presetStart(n); syncPeriod(); }
  fromIn.min = toIn.min = CONFIG.dataStart;
  fromIn.max = toIn.max = today;
  presets.addEventListener('click', function (e) { var b = e.target.closest('[data-months]'); if (b) setMonths(Number(b.dataset.months)); });
  fromIn.addEventListener('input', syncPeriod);
  toIn.addEventListener('input', syncPeriod);
  setMonths(CONFIG.defaultMonths);

  var ops = $('#ops');
  if (CONFIG.opsUrl) {
    ops.disabled = false;
    ops.addEventListener('click', function () { window.open(CONFIG.opsUrl, '_blank', 'noopener'); });
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var t = msg.value.trim();
    if (busy) return;
    if (!t && marketing) t = '마케팅 메시지를 만들어줘';
    if (!t) return;
    if (!fromIn.checkValidity() || !toIn.checkValidity()) { syncPeriod(); fromIn.focus(); return; }
    send(t, marketing);
  });
  msg.addEventListener('keydown', function (e) {
    // 한글 조합 중 Enter는 무시해야 마지막 글자가 두 번 전송되지 않습니다
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
      e.preventDefault();
      form.requestSubmit();
    }
  });
  msg.addEventListener('input', fit);
  $('#reset').addEventListener('click', reset);
  function setStream(b) {
    stream = b;
    $('#streamBtn').setAttribute('aria-pressed', b ? 'true' : 'false');
    try { localStorage.setItem('kt-chat-stream', b ? '1' : '0'); } catch (e) { /* 무시 */ }
  }
  setStream(stream);
  $('#streamBtn').addEventListener('click', function () { setStream(!stream); });
  $('#mkt').addEventListener('click', function () { setMarketing(!marketing); msg.focus(); });

  reset();
})();
</script>
</body>
</html>
