<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KT 요금제 상담 AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 상담 화면: 왼쪽 사전 고객 정보 · 가운데 검토 보고서(+ 가정 바꿔 보기) · 오른쪽 후속 질문 채팅.
   한 대화 = 한 분석. 기간을 바꾸거나 다시 분석하려면 새 대화를 시작합니다. */
:root {
  color-scheme: light;
  --bg: #F1F2F4;
  --surface: #FFFFFF;
  --sunken: #F6F7F9;
  --ink: #15171C;
  --muted: #5B6270;
  --line: #DDE0E6;
  --accent: #E4002B;
  --accent-soft: #FCE7EB;
  --on-accent: #FFFFFF;
  --user-bg: #1A1D24;
  --user-fg: #F4F5F7;
  --bad: #B3261E;
  --up: #A65A00;
  --down: #0C7A55;
  --series-1: #2a78d6;
  --series-1-soft: #cde2fb;
  --font-body: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1115; --surface: #181B21; --sunken: #1E222A; --ink: #ECEEF2; --muted: #98A0AE; --line: #2A2F39;
    --accent: #FF5470; --accent-soft: #3A1A22; --on-accent: #1A0409; --user-bg: #2B303B; --user-fg: #ECEEF2;
    --bad: #FF8A80; --up: #F2B45E; --down: #4FD3A2; --series-1: #3987e5; --series-1-soft: #1c3a5e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1115; --surface: #181B21; --sunken: #1E222A; --ink: #ECEEF2; --muted: #98A0AE; --line: #2A2F39;
  --accent: #FF5470; --accent-soft: #3A1A22; --on-accent: #1A0409; --user-bg: #2B303B; --user-fg: #ECEEF2;
  --bad: #FF8A80; --up: #F2B45E; --down: #4FD3A2; --series-1: #3987e5; --series-1-soft: #1c3a5e;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
button, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.label { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

/* ---------- 틀: 화면 전체를 씁니다 ---------- */
.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
.brand { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
.brand .kt { color: var(--accent); margin-right: 6px; letter-spacing: 0.02em; }
.top-actions { display: flex; gap: 8px; align-items: center; }
.top .viewswitch { display: none; }

.work { min-height: 0; display: grid; grid-template-columns: 272px minmax(0, 1fr) 380px; }
.side, .report, .chat { min-height: 0; min-width: 0; }
.side { overflow-y: auto; background: var(--surface); border-right: 1px solid var(--line); padding: 16px; display: flex; flex-direction: column; gap: 18px; }
.report { overflow-y: auto; padding: 20px 24px 32px; }
.chat { background: var(--surface); border-left: 1px solid var(--line); display: flex; flex-direction: column; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 14px; font-size: 14px; font-weight: 500; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn:disabled { opacity: 0.55; cursor: not-allowed; }
.btn.sm { padding: 4px 10px; font-size: 13px; }

/* ---------- 왼쪽: 고객 선택 · 기간 · 사전 정보 ---------- */
.blk { display: flex; flex-direction: column; gap: 8px; }
.idrow { display: flex; gap: 6px; }
.idrow input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--sunken); border-radius: 8px; padding: 7px 10px; font-size: 14px; font-family: var(--font-mono); letter-spacing: 0.04em; text-transform: uppercase; }
.idrow input::placeholder { text-transform: none; letter-spacing: 0; font-family: var(--font-body); color: var(--muted); }
.idrow input[aria-invalid="true"] { border-color: var(--bad); }
.note { font-size: 12px; color: var(--muted); line-height: 1.45; }
.note.bad { color: var(--bad); }
.note.ok { color: var(--down); }

.cands summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; }
.cands summary::-webkit-details-marker { display: none; }
.cands summary::after { content: '▾'; color: var(--muted); font-size: 12px; }
.cands[open] summary::after { content: '▴'; }
.customers { border: 0; margin: 8px 0 0; padding: 0; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.pick { position: relative; display: flex; flex-direction: column; gap: 1px; min-width: 0; background: var(--sunken); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; cursor: pointer; }
.pick input { position: absolute; opacity: 0; pointer-events: none; }
.pick .nm { font-weight: 700; font-size: 13px; }
.pick .nm small { font-family: var(--font-mono); font-weight: 400; font-size: 11px; color: var(--muted); margin-left: 6px; }
.pick .rate { font-size: 12px; font-variant-numeric: tabular-nums; }
.pick .why { font-size: 12px; color: var(--muted); line-height: 1.35; }
.pick:hover { border-color: var(--accent); }
.pick:has(input:checked) { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--surface); }
.pick:has(input:checked) .nm { color: var(--accent); }
.pick:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.pick:has(input:disabled) { cursor: not-allowed; opacity: 0.55; }
.pick:has(input:checked:disabled) { opacity: 1; }

.period { display: flex; flex-direction: column; gap: 8px; }
.dates { display: grid; grid-template-columns: 1fr; gap: 4px; }
.dates input { width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--sunken); border-radius: 8px; padding: 6px 8px; font-size: 13px; font-variant-numeric: tabular-nums; }
.dates input:invalid { border-color: var(--bad); }
.dates input:disabled { cursor: not-allowed; opacity: 0.6; }
.presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.presets .btn { padding: 5px 0; font-size: 13px; }
.presets .btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }

.base { border-top: 1px solid var(--line); padding-top: 16px; display: flex; flex-direction: column; gap: 12px; }
.who-name { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.2; }
.who-meta { font-size: 13px; color: var(--muted); margin-top: 2px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.scope { font-size: 12px; color: var(--muted); }
.scope summary { cursor: pointer; }
.scope ul { margin: 6px 0 0; padding-left: 18px; }

/* ---------- 가운데: 검토 보고서 ---------- */
.empty { max-width: 560px; margin: 8vh auto 0; text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 14px; align-items: center; }
.empty h2 { margin: 0; font-size: 18px; color: var(--ink); }
.empty p { margin: 0; }
.loading { display: flex; flex-direction: column; gap: 12px; }
.sk { background: var(--sunken); border-radius: 8px; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.5; } }
@media (prefers-reduced-motion: reduce) { .sk, .dots i { animation: none !important; } }

.rhead { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; margin-bottom: 14px; }
.rhead h2 { margin: 0; font-size: 20px; letter-spacing: -0.01em; }
.rhead .meta { font-size: 13px; color: var(--muted); }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-bottom: 14px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.kpi .v { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; line-height: 1.25; }
.kpi .s { font-size: 13px; color: var(--muted); }
.kpi.hl { border-color: var(--accent); }

.notices { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; font-size: 14px; }
.notices .nh { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 500; }
.notices .md { margin-top: 6px; }
.notices.clamp .md > ul > li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.notices.clamp .md li ul { display: none; }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 14px; overflow-x: auto; }
.tab { border: 0; background: none; padding: 8px 14px; font-size: 14px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 700; }

/* 가정 바꿔 보기 */
.whatif { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
.wi { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 5px 12px; font-size: 13px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.seg button:disabled { opacity: 0.5; cursor: not-allowed; }
.checks { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; }
.checks label { display: inline-flex; gap: 5px; align-items: center; white-space: nowrap; }
.checks input { accent-color: var(--accent); }
.lock { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; padding: 4px 9px; border: 1px dashed var(--line); border-radius: 999px; color: var(--muted); }
.wi-foot { flex-basis: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); }
.wi-foot .changed { color: var(--up); font-weight: 500; }
.wi-off { font-size: 13px; color: var(--muted); margin-bottom: 12px; }

/* 선택지 표 */
.otable-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.otable { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.otable th, .otable td { padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; text-align: right; white-space: nowrap; }
.otable th { font-size: 12px; font-weight: 500; color: var(--muted); background: var(--sunken); position: sticky; top: 0; }
.otable th:first-child, .otable td:first-child { text-align: left; white-space: normal; min-width: 210px; }
.otable tr.cur td { background: var(--sunken); }
.otable tr.opt { cursor: pointer; }
.otable tr.opt:hover td { background: color-mix(in srgb, var(--sunken) 60%, transparent); }
.otable tr.detail td { background: var(--sunken); text-align: left; white-space: normal; font-size: 13px; }
.otable .final { font-weight: 700; }
.oname { display: flex; flex-direction: column; gap: 3px; }
.oname .pl { font-weight: 700; }
.oname .bn { font-size: 12px; color: var(--muted); }
.oname button { all: unset; cursor: pointer; }
.oname button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.tag.best { border-color: var(--accent); color: var(--accent); font-weight: 700; }
.tag.warn { border-color: var(--up); color: var(--up); }
.d-neg { color: var(--down); }
.d-pos { color: var(--bad); }
.dgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px 20px; }
.dgrid ul { margin: 2px 0 0; padding-left: 18px; }
.foot { font-size: 12px; color: var(--muted); margin-top: 10px; }
.foot summary { cursor: pointer; }
.foot .md { margin-top: 6px; }

/* 사용량 */
.ugrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; min-width: 0; }
.card h3 { margin: 0 0 2px; font-size: 15px; }
.card .sub { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
.card.wide { grid-column: 1 / -1; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .ax { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.chart .bar { fill: var(--series-1); }
.chart .bar:hover, .chart .bar.on { fill: color-mix(in srgb, var(--series-1) 75%, var(--ink)); }
.chart .avg { stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 4 4; }
.chart .val { fill: var(--ink); font-size: 12px; font-weight: 500; font-family: var(--font-body); }
.stable { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.stable th, .stable td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: right; vertical-align: middle; white-space: nowrap; }
.stable th { font-size: 12px; font-weight: 500; color: var(--muted); }
.stable th:first-child, .stable td:first-child, .stable td.l, .stable th.l { text-align: left; }
.stable td.wrap { white-space: normal; }
.spark { width: 120px; height: 28px; display: block; margin-left: auto; }
.spark polyline { fill: none; stroke: var(--series-1); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.spark circle { fill: var(--series-1); }
.spark .zero { stroke: var(--muted); stroke-dasharray: 3 3; }
.st { font-size: 12px; }
.st.warn { color: var(--up); font-weight: 500; }
.hbars { display: flex; flex-direction: column; gap: 7px; font-size: 13px; }
.hb { display: grid; grid-template-columns: 70px 1fr auto; gap: 10px; align-items: center; }
.hb .track { height: 10px; background: var(--sunken); border-radius: 0 4px 4px 0; }
.hb .fill { height: 100%; background: var(--series-1); border-radius: 0 4px 4px 0; }
.hb .v { white-space: nowrap; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }

.fallback { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }

/* ---------- 오른쪽: 채팅 ---------- */
.chat-head { padding: 10px 14px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.chat-head .sid { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.feed { flex: 1; min-height: 0; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.row.user { align-items: flex-end; }
.row.ai { align-items: flex-start; }
.who { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.05em; color: var(--muted); }
.bubble { padding: 9px 12px; max-width: 94%; min-width: 0; overflow-wrap: anywhere; font-size: 14px; }
.user .bubble { background: var(--user-bg); color: var(--user-fg); border-radius: 14px 14px 4px 14px; white-space: pre-wrap; }
.ai .bubble { background: var(--sunken); border: 1px solid var(--line); border-radius: 14px 14px 14px 4px; }
.ai .bubble.err { border-color: var(--bad); }
.ai .bubble.done { border-color: var(--accent); }
.err-title { color: var(--bad); font-weight: 700; margin: 0 0 4px; }
.composer { border-top: 1px solid var(--line); padding: 10px 12px 12px; }
.composer form { display: flex; gap: 8px; align-items: flex-end; }
.composer textarea { flex: 1; min-width: 0; resize: none; max-height: 160px; border: 1px solid var(--line); background: var(--sunken); border-radius: 8px; padding: 9px 11px; line-height: 1.45; }
.composer textarea::placeholder { color: var(--muted); }
.composer textarea:disabled { opacity: 0.55; cursor: not-allowed; }
.hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
.suggest { display: flex; flex-direction: column; gap: 6px; max-width: 94%; margin-top: 4px; }
.suggest .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 13px; line-height: 1.4; text-align: left; }
.chip:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.chip:disabled { opacity: 0.55; cursor: not-allowed; }
.dots { display: flex; gap: 5px; padding: 6px 0; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.1s ease-in-out infinite; }
.dots i:nth-child(2) { animation-delay: 0.15s; }
.dots i:nth-child(3) { animation-delay: 0.3s; }
@keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

/* 마크다운 */
.md { display: flex; flex-direction: column; gap: 8px; }
.md p { margin: 0; }
.md h4 { margin: 6px 0 0; font-size: 15px; }
.md ul, .md ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 3px; }
.md blockquote { margin: 0; padding: 8px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; color: var(--muted); }
.md code { font-family: var(--font-mono); font-size: 13px; background: var(--surface); padding: 0 4px; border-radius: 4px; }
.md li > ul { margin-top: 2px; }
.md hr { border: 0; border-top: 1px solid var(--line); width: 100%; margin: 4px 0; }
.md pre.code { margin: 0; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.5; }
.md img { max-width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--line); background: #fff; }
.table-wrap { overflow-x: auto; }
.md table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.md th, .md td { text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--line); vertical-align: top; }
.md thead th { font-weight: 700; }

.tip { position: fixed; z-index: 50; pointer-events: none; background: var(--ink); color: var(--surface); font-size: 12px; padding: 5px 8px; border-radius: 6px; max-width: 260px; white-space: pre-line; font-variant-numeric: tabular-nums; }

/* ---------- 좁은 화면: 왼쪽은 위로 접고, 보고서와 대화를 버튼으로 오갑니다 ---------- */
@media (max-width: 1280px) {
  .work { grid-template-columns: 248px minmax(0, 1fr) 360px; }
  .report { padding: 16px 18px 28px; }
}
@media (max-width: 1080px) {
  .top .viewswitch { display: inline-flex; }
  .work { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .side { border-right: 0; border-bottom: 1px solid var(--line); max-height: 34vh; padding: 12px 16px; }
  .work[data-view="report"] .chat { display: none; }
  .work[data-view="chat"] .report { display: none; }
  .chat { border-left: 0; }
}
@media (max-width: 600px) {
  .top { padding: 8px 12px; }
  .brand { font-size: 15px; }
  .report { padding: 12px; }
  .ugrid { grid-template-columns: minmax(0, 1fr); }
  .hint { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="kt">KT</span>요금제 상담 AI</div>
    <div class="top-actions">
      <div class="seg viewswitch" role="group" aria-label="보기 전환">
        <button type="button" data-view="report" aria-pressed="true">보고서</button>
        <button type="button" data-view="chat" aria-pressed="false">대화</button>
      </div>
      <button class="btn" type="button" id="ops" disabled title="운영 대시보드로 이동합니다. 대시보드의 상담 버튼으로 돌아옵니다">운영</button>

<script>
(function () {
  'use strict';

  var CONFIG = {

    stream: false,

    users: [
      { id: 'U00603', name: '김수서', plan: '초이스90', fee: 90000, data: '무제한 · 5G',
        services: ['티빙 스탠다드'], meta: '결합 없음 · KT 인터넷 없음', avgGb: 176.8,
        reason: '적정 유지 확인 · 월 176.8GB 헤비 유저, 티빙 실사용',

      { id: 'U09832', name: '윤서준', plan: '베이직21GB(이월)', fee: 58000, data: '월 21GB · LTE/5G',
        services: [], meta: '가족 정보 없음', avgGb: 71.1,
        reason: '업셀 후보 · 제공 21GB에 월 71.1GB 사용',
        ask: '제공량 21GB를 넘는 사용분이 주로 어떤 콘텐츠에서 나와?' },
      { id: 'U09327', name: '임서윤', plan: '초이스130', fee: 130000, data: '무제한 · 5G',
        services: ['지니뮤직', '밀리의서재'], meta: '가족 정보 없음', avgGb: 5.2,
        reason: '다운셀 후보 · 최고가 무제한에 월 5.2GB 사용',

      { id: 'U00864', name: '이현서', plan: '초이스 더블', fee: 120000, data: '무제한 · 5G',
        services: ['Disney+ 스탠다드', '단말보험 멤버십 할인'], meta: 'KT 인터넷 보유 · 결합 없음', avgGb: 163.2,
        reason: '결합 후보 · 인터넷 보유·미결합, Disney+ 사용 기록 없음',
        ask: 'KT 인터넷과 결합하면 월 청구액이 얼마나 달라져?' }
    ],
    dataStart: '2025-10-24',
    defaultMonths: 6,
    // 상담 화면의 고정 가정. 단말은 5G로 보고 하향 정산 표시를 정하고, 인터넷 약정은 n8n 기준값(12개월)을 씁니다
    fixed: { device: '5G', contractMonths: 12 },
    fiveGFreeFee: 47000      // 5G 단말 심플코스: 새 월정액이 이 값 이상이면 차액정산 면제 (README 5항)
  };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmt(n) { return Number(n).toLocaleString('ko-KR'); }
  function won(n) { return fmt(n) + '원'; }
  function delta(n) {
    if (!n) return '<span class="num">±0원</span>';
    return '<span class="num ' + (n < 0 ? 'd-neg' : 'd-pos') + '">' + (n < 0 ? '−' : '+') + fmt(Math.abs(n)) + '원</span>';
  }

  /* ---------- 응답 읽기 ----------
     보고서 응답에는 output(마크다운)과 review(review-v1, 구조화 데이터)가 함께 옵니다. 후속 질문은 reply만 옵니다. */
  function parseReply(raw) {
    var t = String(raw).trim(), body;
    try { body = JSON.parse(t); } catch (e) {
      var acc = '', seen = false;
      t.split('\n').forEach(function (l) {
        try { var o = JSON.parse(l); if (o && o.type === 'item' && typeof o.content === 'string') { acc += o.content; seen = true; } } catch (e2) { /* 무시 */ }
      });
      return { text: seen ? acc : t, payload: null };
    }
    if (Array.isArray(body)) body = body[0];
    if (!body || typeof body !== 'object') return { text: body == null ? '' : String(body), payload: null };
    var out = body.output !== undefined ? body.output : body.reply !== undefined ? body.reply : body.text !== undefined ? body.text : body.message;
    var text = out === undefined ? '```\n' + JSON.stringify(body, null, 2) + '\n```'
      : typeof out === 'string' ? out : '```\n' + JSON.stringify(out, null, 2) + '\n```';
    var review = body.review;
    if (typeof review === 'string') { try { review = JSON.parse(review); } catch (e) { review = null; } }
    var ok = review && typeof review === 'object' && /^review-/.test(review.version || '') && review.data && Array.isArray(review.data.options);
    return { text: text, payload: ok ? { review: review, analysisId: body.analysis_id || '' } : null };
  }

  function StreamState() { this.segs = []; this.steps = 0; this.error = ''; this.respond = ''; this.buf = ''; }
  StreamState.prototype.push = function (chunk) {
    var lines = (this.buf + chunk).split('\n');
    this.buf = lines.pop();
    for (var i = 0; i < lines.length; i++) this.line(lines[i]);
  };
  StreamState.prototype.line = function (l) {
    var o; try { o = JSON.parse(l); } catch (e) { return; }
    if (!o || typeof o !== 'object') return;
    var node = (o.metadata && o.metadata.nodeName) || '';
    if (o.type === 'error') { this.error = String(o.content || 'error'); return; }
    if (node === 'Respond to Webhook') { if (o.type === 'item') this.respond += o.content || ''; return; }
    if (o.type === 'begin') { this.steps++; this.segs.push(''); return; }
    if (o.type === 'item' && typeof o.content === 'string') {
      if (!this.segs.length) this.segs.push('');
      this.segs[this.segs.length - 1] += o.content;
    }
  };
  StreamState.prototype.text = function () {
    for (var i = this.segs.length - 1; i >= 0; i--) if (this.segs[i].trim()) return this.segs[i];
    return this.respond ? parseReply(this.respond).text : '';
  };

  /* ---------- 작은 마크다운 렌더러 (입력은 항상 esc()를 거칩니다) ---------- */
  function cells(row) { return row.trim().replace(/^\||\|$/g, '').split('|').map(function (c) { return c.trim(); }); }
  function inline(s) {
    return s
      .replace(/!\[([^\]]*)\]\((https:\/\/[^\s)]+)\)/g, '<img src="$2" alt="$1" loading="lazy">')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  }
  function md(src) {
    var lines = String(src).replace(/\r/g, '').split('\n'), html = '', i = 0, list = null;
    function closeList() { if (list) { html += '</' + list + '>'; list = null; } }
    while (i < lines.length) {
      var ln = lines[i];
      if (/^```/.test(ln)) {
        closeList();
        var buf = []; i++;
        while (i < lines.length && !/^```/.test(lines[i])) { buf.push(lines[i]); i++; }
        i++;
        html += '<pre class="code">' + esc(buf.join('\n')) + '</pre>';
        continue;
      }
      if (/^\s*\|.*\|\s*$/.test(ln) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
        closeList();
        var head = cells(ln), rows = [];
        i += 2;
        while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) { rows.push(cells(lines[i])); i++; }
        html += '<div class="table-wrap"><table><thead><tr>' + head.map(function (c) { return '<th>' + inline(esc(c)) + '</th>'; }).join('') +
          '</tr></thead><tbody>' + rows.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + inline(esc(c)) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>';
        continue;
      }
      var h = ln.match(/^(#{1,4})\s+(.*)$/);
      if (h) { closeList(); html += '<h4>' + inline(esc(h[2])) + '</h4>'; i++; continue; }
      var ul = ln.match(/^\s*[-*]\s+(.*)$/), ol = ln.match(/^\s*\d+[.)]\s+(.*)$/);
      if (ul || ol) {
        var tag = ul ? 'ul' : 'ol';
        if (list !== tag) { closeList(); html += '<' + tag + '>'; list = tag; }
        html += '<li>' + inline(esc((ul || ol)[1]));
        i++;
        var sub = [];
        while (i < lines.length && /^\s{2,}[-*]\s+/.test(lines[i])) { sub.push(lines[i].replace(/^\s*[-*]\s+/, '')); i++; }
        if (sub.length) html += '<ul>' + sub.map(function (s) { return '<li>' + inline(esc(s)) + '</li>'; }).join('') + '</ul>';
        html += '</li>'; continue;
      }
      closeList();
      if (/^\s*>/.test(ln)) {
        var quote = [];
        while (i < lines.length && /^\s*>/.test(lines[i])) { quote.push(lines[i].replace(/^\s*>\s?/, '')); i++; }
        html += '<blockquote class="md">' + md(quote.join('\n')) + '</blockquote>';
        continue;
      }
      if (/^\s*(---+|\*\*\*+)\s*$/.test(ln)) { html += '<hr>'; i++; continue; }
      if (!ln.trim()) { i++; continue; }
      html += '<p>' + inline(esc(ln)) + '</p>'; i++;
    }
    closeList();
    return html;
  }
  // 보고서 마크다운을 "#### 제목" 단위로 나눕니다 (유의사항·가족결합·주의점은 n8n이 쓴 문장을 그대로 씁니다)
  function sections(out) {
    var map = {}, cur = '_top';
    map[cur] = [];
    String(out || '').replace(/\r/g, '').split('\n').forEach(function (l) {
      var h = l.match(/^####\s+(.*)$/);
      if (h) { cur = h[1].trim(); map[cur] = []; } else map[cur].push(l);
    });
    Object.keys(map).forEach(function (k) { map[k] = map[k].join('\n').trim(); });
    return map;
  }
  function sectionTitle(map, prefix) { return Object.keys(map).filter(function (k) { return k.indexOf(prefix) === 0; })[0] || ''; }

  /* ============ 가정 바꿔 보기 계산 ============
     n8n Evaluate Options가 낸 값(review.data.options)을 그대로 쓰고, 다음 세 가지만 화면에서 다시 더하고 뺍니다.
       1) 선택약정 25%: 각 선택지의 selective(월정액 × 25%)를 뺍니다
       2) 본인 결합 할인: 범위 [최소, 최대] 중 하나를 고릅니다 (기준 회선 동률 / 할인 배분)
       3) 계속 쓸 유료 서비스: 고객이 끊을 서비스의 정가를 별도 구독액(extra)에서 뺍니다
     인터넷 약정기간처럼 결합 규칙이 바뀌는 가정은 화면에서 계산하지 않습니다 (n8n이 다시 계산해야 합니다).
     처음 그릴 때 화면 계산이 보고서 값과 같은지 확인하고, 다르면 이 기능을 끄고 보고서 값만 보여 줍니다. */
  function defaultW() { return { selective: false, tie: 'min', drop: {} }; }
  function isCurrent(o) { return o.key === 'CURRENT' || (o.profiles || []).indexOf('current') >= 0; }
  // 각 선택지에서 별도 구독해야 하는 유료 서비스. 현재 상태는 목록이 없어 "선택하지 않았지만 쓰는 유료 서비스"로 만듭니다
  function uncoveredOf(o, D) {
    if (Array.isArray(o.uncovered)) return o.uncovered;
    if (isCurrent(o)) return (D.services || []).filter(function (s) { return s.access === 'PAYWALLED' && s.status === 'NOT_SELECTED_USED'; })
      .map(function (s) { return { name: s.name, won: s.list_price_won || 0 }; });
    return [];
  }
  function sum(list) { return list.reduce(function (a, b) { return a + (b.won || 0); }, 0); }
  function famTotal(o, D) {
    if (o.bundle && typeof o.bundle.family_total === 'number') return o.bundle.family_total;
    if (isCurrent(o) && D.bundle && D.bundle.current && typeof D.bundle.current.family_total === 'number') return D.bundle.current.family_total;
    return 0;
  }
  function calcOne(o, D, W) {
    var unc = uncoveredOf(o, D), dropOk = sum(unc) === (o.extra || 0);
    var dropped = dropOk ? sum(unc.filter(function (u) { return W.drop[u.name]; })) : 0;
    var extra = (o.extra || 0) - dropped, bill = o.fee + extra;
    var disc = Array.isArray(o.discount) ? o.discount[W.tie === 'max' ? 1 : 0] || 0 : 0;
    var sel = W.selective ? o.selective || 0 : 0;
    return { o: o, unc: unc, dropOk: dropOk, extra: extra, bill: bill, disc: disc, sel: sel, final: bill - disc - sel, fam: famTotal(o, D) };
  }
  function calc(D, W) {
    var rows = D.options.map(function (o) { return calcOne(o, D, W); });
    var cur = rows.filter(function (r) { return isCurrent(r.o); })[0] || rows[0];
    rows.forEach(function (r) {
      r.own = r.final - cur.final;
      // 가족 전체 = 본인 회선 요금 변화(결합 할인 전, 선택약정 반영) − 가족 결합 할인 합계 변화. 다른 가족 회선 요금제는 그대로
      r.family = (r.bill - r.sel) - (cur.bill - cur.sel) - (r.fam - cur.fam);
    });
    var alts = rows.filter(function (r) { return r !== cur; });
    function minBy(k) { var m = Math.min.apply(null, alts.map(function (r) { return r[k]; })); return alts.filter(function (r) { return r[k] === m; }); }
    return { rows: rows, cur: cur, bestOwn: alts.length ? minBy('own') : [], bestFam: alts.length ? minBy('family') : [] };
  }
  // 화면 계산이 보고서 값과 같은지 확인합니다 (기본 가정, 선택약정 적용 두 가지)
  function selfCheck(D) {
    try {
      var a = calc(D, defaultW()), b = calc(D, { selective: true, tie: 'min', drop: {} }), bad = [];
      a.rows.forEach(function (r, i) {
        var o = r.o;
        if (r.final !== o.final) bad.push(o.label + ' 최종 청구');
        if (!isCurrent(o) && typeof o.saving === 'number' && r.own !== -o.saving) bad.push(o.label + ' 본인 현재 대비');
        if (typeof o.family_monthly_change === 'number' && r.family !== o.family_monthly_change) bad.push(o.label + ' 가족 전체');
        if (typeof o.final_selective === 'number' && b.rows[i].final !== o.final_selective) bad.push(o.label + ' 선택약정');
      });
      return bad;
    } catch (e) { return ['계산 오류: ' + e.message]; }
  }

  var PROFILE = { current: '현재 상태', lowest_bill_keep_access: '최저 청구', safe_margin: '여유 용량', balanced: '균형',
    lowest_fee_drop_extras: '최저 월정액', minimum_change: '최소 변경', max_coverage: '최대 혜택', bundle_only: '결합만 가입',
    lowest_bill_selective: '선택약정 시 최저' };
  var BUNDLE_TYPE = { PREMIUM_FAMILY: '프리미엄 가족결합', INTERNET_MOBILE: '인터넷·모바일 결합' };
  var BUNDLE_METHOD = { TOTAL: '총액', FIXED: '정액' };
  var BUNDLE_ACTION = { JOIN: '가입 시', KEEP: '유지', CHANGE: '변경', SWITCH: '전환', NONE: '' };
  function bundleText(o) {
    if (!o.bundle) return '결합 없음';
    var b = o.bundle;
    return (BUNDLE_TYPE[b.type] || b.type || '결합') + (b.method ? ' · ' + (BUNDLE_METHOD[b.method] || b.method) : '') +
      (BUNDLE_ACTION[o.bundle_action] ? ' (' + BUNDLE_ACTION[o.bundle_action] + ')' : '');
  }
  // 주의 열: 5G 단말 가정으로 하향 정산 표시를 하나로 정합니다
  function warnings(o) {
    var w = [];
    if (o.settlement) w.push(o.fee >= CONFIG.fiveGFreeFee ? '하향: 베이직코스면 정산' : '하향: 정산 대상 (5G)');

  function monthBars(months, avg) {
    if (!months.length) return '<p class="note">월별 데이터가 없습니다</p>';
    var W = 420, H = 200, L = 32, R = 6, T = 18, B = 22, iw = W - L - R, ih = H - T - B;
    var max = Math.max.apply(null, months.map(function (m) { return m.gb; }).concat([avg || 0])) * 1.1 || 1;
    var step = iw / months.length, bw = Math.min(40, step * 0.56), peak = Math.max.apply(null, months.map(function (m) { return m.gb; }));
    function y(v) { return T + ih - v / max * ih; }
    var g = '', ticks = [0, max / 2, max].map(function (v) { return Math.round(v / 10) * 10; });
    ticks.forEach(function (v) { g += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text class="ax" x="' + (L - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + v + '</text>'; });
    months.forEach(function (m, i) {
      var x = L + step * i + (step - bw) / 2, top = y(m.gb), h = T + ih - top, r = Math.min(4, h);
      g += '<path class="bar" data-tip="' + esc(m.month + ': ' + m.gb + 'GB') + '" d="M' + x + ',' + (T + ih) + 'V' + (top + r) + 'Q' + x + ',' + top + ' ' + (x + r) + ',' + top + 'H' + (x + bw - r) + 'Q' + (x + bw) + ',' + top + ' ' + (x + bw) + ',' + (top + r) + 'V' + (T + ih) + 'Z"/>';
      g += '<text class="ax" x="' + (x + bw / 2) + '" y="' + (H - 6) + '" text-anchor="middle">' + Number(m.month.slice(5)) + '월</text>';
      if (m.gb === peak) g += '<text class="val" x="' + (x + bw / 2) + '" y="' + (top - 5) + '" text-anchor="middle">' + m.gb + '</text>';
    });
    if (avg) g += '<line class="avg" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(avg) + '" y2="' + y(avg) + '"/><text class="ax" x="' + (W - R) + '" y="' + (y(avg) - 5) + '" text-anchor="end">평균 ' + avg + '</text>';
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="월별 사용량 GB: ' + esc(months.map(function (m) { return m.month + ' ' + m.gb; }).join(', ')) + '">' + g + '</svg>';
  }
  function spark(vals, months, name) {
    var w = 120, h = 28, p = 3, max = Math.max.apply(null, vals.concat([0]));
    var tipTxt = name + '\n' + vals.map(function (v, i) { return (months[i] ? months[i].month : i + 1) + ': ' + v + 'GB'; }).join('\n');
    if (!vals.length) return '−';
    if (!max) return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" data-tip="' + esc(tipTxt) + '" role="img" aria-label="사용 없음"><line class="zero" x1="' + p + '" x2="' + (w - p) + '" y1="' + (h - p) + '" y2="' + (h - p) + '"/></svg>';
    var pts = vals.map(function (v, i) { return [(p + (w - 2 * p) * (vals.length === 1 ? 0.5 : i / (vals.length - 1))).toFixed(1), (h - p - (h - 2 * p) * v / max).toFixed(1)]; });
    var last = pts[pts.length - 1];
    return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" data-tip="' + esc(tipTxt) + '" role="img" aria-label="' + esc(tipTxt.replace(/\n/g, ', ')) + '"><polyline points="' + pts.map(function (q) { return q.join(','); }).join(' ') + '"/><circle cx="' + last[0] + '" cy="' + last[1] + '" r="3"/></svg>';
  }

      $('#custName').textContent = u.name;
      $('#custMeta').textContent = u.id + ' · ' + u.meta;
      kv.innerHTML = row('현재 요금제', u.plan) + row('월정액', won(u.fee)) + row('데이터', u.data) +
        row('선택 혜택', u.services.length ? u.services.join(', ') : '없음') + row('월평균 사용', u.avgGb + 'GB');
      $('#custNote').textContent = '2026-10-02 조회값 · 월평균은 2026-04~09 기준. 분석 결과는 가운데 보고서를 보세요.';
    } else {
      $('#custName').textContent = user;
      $('#custMeta').textContent = '화면에 준비된 사전 정보가 없는 고객입니다';
      kv.innerHTML = ''; $('#custNote').textContent = '요금제와 사용량은 검토 보고서에서 확인하세요.';
    }
  }

  /* ---------- 분석 기간 ---------- */
  function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function minusMonths(s, n) {
    var p = s.split('-').map(Number), m = p[1] - 1 - n;
    var last = new Date(p[0], m + 1, 0).getDate();
    return iso(new Date(p[0], m, Math.min(p[2], last)));
  }
  var today = iso(new Date());
  function presetStart(n) { var s = minusMonths(today, n); return s < CONFIG.dataStart ? CONFIG.dataStart : s; }
  function syncPeriod() {
    fromIn.max = toIn.value || today;
    toIn.min = fromIn.value || CONFIG.dataStart;
    presets.querySelectorAll('[data-months]').forEach(function (b) {
      var on = toIn.value === today && fromIn.value === presetStart(Number(b.dataset.months));
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    var s = st(), ok = fromIn.checkValidity() && toIn.checkValidity();
    periodNote.className = 'note';
    periodNote.textContent = s && (s.report || s.loading) ? '이 상담의 분석 기간입니다. 다른 기간은 새 대화에서 분석합니다'
      : !ok ? CONFIG.dataStart + ' ~ ' + today + ' 사이에서 시작일이 종료일보다 앞서야 합니다'
      : fromIn.value === CONFIG.dataStart ? CONFIG.dataStart + '부터 데이터가 있습니다' : '';
  }
  function setMonths(n) { toIn.value = today; fromIn.value = presetStart(n); syncPeriod(); if (st() && !st().report) renderReport(); }
  fromIn.min = toIn.min = CONFIG.dataStart;
  fromIn.max = toIn.max = today;
  presets.addEventListener('click', function (e) { var b = e.target.closest('[data-months]'); if (b && !b.disabled) setMonths(Number(b.dataset.months)); });
  fromIn.addEventListener('input', function () { syncPeriod(); if (st() && !st().report) renderReport(); });
  toIn.addEventListener('input', function () { syncPeriod(); if (st() && !st().report) renderReport(); });
  setMonths(CONFIG.defaultMonths);

  var ops = $('#ops');
  if (CONFIG.opsUrl) {
    ops.disabled = false;
    ops.addEventListener('click', function () { location.href = CONFIG.opsUrl; });
  }

  function ask(t, intent) {
    if (busy || !user || !t) return;
    if (!fromIn.checkValidity() || !toIn.checkValidity()) { syncPeriod(); fromIn.focus(); return; }
    send(t, intent);
  }
  form.addEventListener('submit', function (e) { e.preventDefault(); ask(msg.value.trim()); });
  feed.addEventListener('click', function (e) { var c = e.target.closest('.chip'); if (c) ask(c.dataset.q, c.dataset.intent); });
  msg.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); form.requestSubmit(); }
  });
  msg.addEventListener('input', fit);
  $('#reset').addEventListener('click', reset);

  showUser();
  reset();
  idIn.focus();
})();
</script>
</body>
</html>
