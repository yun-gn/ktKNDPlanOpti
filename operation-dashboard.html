<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>고객 운영 대시보드 · 분석 카탈로그</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f1f2f4; --surface: #ffffff; --ink: #15171c;
            --ink2: #5b6270; --muted: #7d8490; --grid: #e7e9ed;
            --axis: #cfd3da; --line: #dde0e6; --wash: #f6f7f9;
            --accent: #e4002b; --accent-hover: #c90027;
            --s1: #b64f64; --s2: #c06a4f; --s3: #3f9478;
            --s4: #b58a35; --s5: #8b65a4; --s0: #9da3ad; --track: #ead5da;
            --serious: #c94e48; --empty: #f0f1f3; --sel: rgba(228,0,43,.07);
            --o2: #5f8fa3; --dt1: #fff; --dt2: #15171c; --dt3: #15171c;
            --comparison-gray: #c4c9d0; --comparison-blue: #397fae; --comparison-green: #3f9472;
            --q1: #f5e2e7; --q2: #eec3cd; --q3: #df9eae; --q4: #ce748a; --q5: #b9506b; --q6: #9f3854; --q7: #812b44;
            --qt1: #15171c; --qt2: #15171c; --qt3: #15171c; --qt4: #15171c; --qt5: #fff; --qt6: #fff; --qt7: #fff;
            --bt1: #fff; --bt2: #15171c; --bt3: #15171c; --bt4: #15171c; --bt5: #15171c; --bt6: #15171c;
            --font: "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.55 var(--font); }
        .wrap { max-width: 1440px; margin: 0 auto; padding: 0 20px 40px; display: flex; flex-direction: column; gap: 16px; }
        header { margin: 0 -20px; padding: 15px 20px 14px; background: var(--surface); border-bottom: 1px solid var(--line); }
        h1 { margin: 0; font-size: 21px; line-height: 1.35; font-weight: 700; letter-spacing: -.025em; }
        h1::before { content: "KT"; display: inline-block; margin-right: 9px; color: var(--accent); font-weight: 800; letter-spacing: -.04em; }
        .lede { margin: 5px 0 0; color: var(--ink2); font-size: 12.5px; }
        .connection { padding: 12px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
        .connection summary { cursor: pointer; font-size: 13px; }
        .connection label { display: block; margin-top: 12px; }
        .connection input { width: 100%; margin-top: 5px; }
        .grid { display: grid; grid-template-columns: repeat(12,minmax(0,1fr)); gap: 14px; }
        .card { grid-column: span 6; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; min-width: 0; }
        .card.wide { grid-column: span 12; }
        #subscribers-section { grid-column: span 8; }
        #families-section { grid-column: span 4; }
        #plans-section, #monthly-section { grid-column: span 12; }
        .hd { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px; }
        h2 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -.018em; }
        .description { margin: 4px 0 0; font-size: 12.5px; color: var(--ink2); max-width: 76ch; }
        .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
        .filters, .local-filters { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 14px; padding: 13px 0; }
        .local-filters:empty { display: none; }
        .global-filters { position: sticky; top: env(safe-area-inset-top,0px); z-index: 20; margin: 0 -20px; padding: 12px 20px; background: rgba(255,255,255,.96); border-bottom: 1px solid var(--line); backdrop-filter: blur(8px); }
        label { font-size: 12px; color: var(--ink2); font-weight: 500; }
        label input, label select { display: block; margin-top: 4px; }
        input, select, button { font: inherit; font-size: 12px; min-height: 38px; border: 1px solid var(--line); border-radius: 8px; background: var(--wash); color: var(--ink); padding: 7px 11px; }
        button { cursor: pointer; background: var(--surface); font-weight: 600; }
        button:hover { background: var(--wash); border-color: var(--axis); }
        button.primary { background: var(--accent); border-color: var(--accent); color: #fff; padding-inline: 18px; }
        button.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
        button[aria-pressed="true"], button[aria-expanded="true"] { background: var(--ink); color: var(--surface); }
        .group-filter { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
        .group-options { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 4px 0; }
        .group-options label { display: inline-flex; align-items: center; gap: 5px; color: var(--ink); font-weight: 500; cursor: pointer; white-space: nowrap; }
        .group-options label.all { color: var(--ink2); font-weight: 600; padding-right: 14px; border-right: 1px solid var(--line); }
        .group-options input[type="checkbox"] { display: inline-block; width: 14px; height: 14px; min-height: 0; margin: 0; padding: 0; accent-color: var(--accent); cursor: pointer; }
        .toggle-group { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; }
        .toggle-group > span { font-size: 12px; color: var(--ink2); font-weight: 500; margin-right: 2px; }
        .legend .ramp-label { color: var(--muted); }
        button:disabled, select:disabled { cursor: default; opacity: .55; }
        :focus-visible { outline: 2px solid rgba(228,0,43,.45); outline-offset: 2px; }
        .status, .context, .note { font-size: 12px; color: var(--muted); margin: 5px 0; }
        .status.error { color: var(--s2); }
        .context { color: var(--ink2); }
        .context:empty { display: none; }
        .card[aria-busy="true"] .visuals { opacity: .55; }
        .visuals { display: grid; gap: 16px; }
        .visuals.dual { grid-template-columns: repeat(2,minmax(0,1fr)); }
        .chart-block { min-width: 0; }
        .chart-title { font-size: 13px; font-weight: 700; margin: 8px 0; }
        .plot { overflow-x: auto; min-width: 0; }
        .plot svg { display: block; }
        .plot svg text { font: 11px var(--font); }
        .ramp { display: inline-flex; gap: 2px; }
        .ramp i { width: 16px; height: 10px; display: inline-block; border-radius: 2px; }
        .family-matrix { display: grid; grid-template-columns: minmax(76px,.72fr) repeat(2,minmax(105px,1fr)); gap: 6px; margin-top: 8px; }
        .family-axis { display: grid; place-items: center; min-height: 34px; color: var(--ink2); font-size: 12px; font-weight: 600; text-align: center; }
        .family-cell { min-height: 104px; display: grid; place-items: center; align-content: center; gap: 3px; border: 1px solid var(--line); border-radius: 9px; padding: 12px 8px; text-align: center; }
        .family-cell .share { font-size: 24px; font-weight: 650; font-variant-numeric: tabular-nums; }
        .family-cell .count { color: inherit; font-size: 12px; font-variant-numeric: tabular-nums; opacity: .88; }
        #analysis-tip { position: fixed; z-index: 50; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 8px 24px rgba(21,23,28,.12); max-width: 300px; }
        #analysis-tip .tt { color: var(--ink2); margin-bottom: 4px; }
        #analysis-tip .tr { display: flex; justify-content: space-between; gap: 14px; line-height: 1.55; }
        #analysis-tip strong { font-weight: 650; font-variant-numeric: tabular-nums; }
        .empty { min-height: 160px; display: grid; place-items: center; color: var(--muted); font-size: 13px; }
        .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 11px; color: var(--ink2); margin: 8px 0; }
        .legend span { display: inline-flex; align-items: center; gap: 6px; }
        .swatch { width: 10px; height: 10px; border-radius: 2px; }
        .table-wrap { overflow: auto; max-height: 360px; border: 1px solid var(--line); border-radius: 8px; margin-top: 10px; }
        table { border-collapse: collapse; font-size: 12px; width: 100%; }
        th, td { padding: 5px 9px; border-bottom: 1px solid var(--grid); white-space: nowrap; text-align: right; }
        th:first-child, td:first-child { text-align: left; }
        thead th { position: sticky; top: 0; background: var(--wash); color: var(--ink2); font-weight: 600; }
        td { font-variant-numeric: tabular-nums; }
        caption { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
        [hidden] { display: none !important; }
        footer { color: var(--muted); font-size: 12px; }
        @media (max-width: 1080px) { .card, #subscribers-section, #families-section, #monthly-section, #plans-section { grid-column: span 12; } }
        @media (max-width: 760px) { .visuals.dual { grid-template-columns: 1fr; } }
        @media (max-width: 480px) { .wrap { padding-inline: 10px; } header, .global-filters { margin-inline: -10px; padding-inline: 10px; } .card { padding: 14px; } }
    </style>
</head>
<body>
    <main class="wrap">
        <header>
            <h1>고객 운영 대시보드</h1>
            <p class="lede">기간 필터는 월별·콘텐츠·분포 분석에 적용합니다. 가입자·가족·요금제 비교는 전체 기간 기준으로 고정합니다.</p>
        </header>
        <input id="webhook-url" type="hidden">
        <form id="global-filter-form" class="filters global-filters" aria-label="공통 조회 기간">
            <label>시작 월<input id="start-month" type="month" min="1000-01" max="9998-12" required></label>
            <label>종료 월<input id="end-month" type="month" min="1000-01" max="9998-12" required></label>
            <button id="global-refresh" type="submit" class="primary">새로고침</button>
            <span id="global-status" class="status" role="status">기간 데이터를 불러옵니다.</span>
        </form>
        <div id="analysis-sections" class="grid"></div>
        <footer>사용량은 1,024MB = 1GB 기준입니다. 가입자·가족·요금제 비교는 상단 기간 설정의 영향을 받지 않습니다.</footer>
    </main>
    <div id="analysis-tip" role="tooltip" hidden></div>

        function formatCell(value, column) {

            if (column.type === 'numeric' || column.type === 'bigint') return number(value, column.type === 'bigint' ? 0 : 2);

        function renderTable(state, rows) {

        function makeSelect(state, key, label) {

            items.forEach(item => {

            });
            if ([...select.options].some(item => item.value === previousValue)) select.value = previousValue;
            else if (!includeAll && items.length) select.value = items[items.length - 1].value;
            select.disabled = !items.length;
        }
        /* 요금제 그룹 체크박스: 그래프마다 토글 버튼 하나, 체크박스는 버튼 옆에 펼친다.
           숨긴 그룹을 저장하므로 새로 나타난 그룹은 기본으로 표시된다. */
        function makeGroupFilter(state) {
            const wrap = el('div', undefined, 'group-filter');
            const toggle = el('button'); toggle.type = 'button';
            const panel = el('div', undefined, 'group-options');
            panel.id = state.section.key + '-group-options'; panel.hidden = true;
            panel.setAttribute('role', 'group'); panel.setAttribute('aria-label', '표시할 요금제 그룹');
            toggle.setAttribute('aria-controls', panel.id); toggle.setAttribute('aria-expanded', 'false');
            toggle.addEventListener('click', () => {
                const open = panel.hidden;
                panel.hidden = !open;
                toggle.setAttribute('aria-expanded', String(open));
            });
            wrap.append(toggle, panel);
            state.localFilters.append(wrap);
            state.groupFilter = { toggle, panel, hidden: new Set(), groups: [] };
            updateGroupToggle(state);
        }
        function updateGroupToggle(state) {
            const filter = state.groupFilter, total = filter.groups.length;
            const shown = filter.groups.filter(name => !filter.hidden.has(name)).length;
            filter.toggle.textContent = '요금제 그룹 ' + (!total ? '' : shown === total ? '· 전체' : '· ' + shown + '/' + total);
            filter.toggle.disabled = !total;
        }
        const groupVisible = (state, planName) => !state.groupFilter || !state.groupFilter.hidden.has(planGroup(planName));
        function refreshGroupFilter(state) {
            const filter = state.groupFilter;
            if (!filter) return;
            const present = new Set(state.rows.map(row => planGroup(row.plan_name)));
            filter.groups = PLAN_GROUPS.filter(name => present.has(name));
            filter.panel.replaceChildren();
            const allLabel = el('label', undefined, 'all'), all = el('input');
            all.type = 'checkbox';
            allLabel.append(all, doc.createTextNode('전체'));
            filter.panel.append(allLabel);
            const boxes = filter.groups.map(name => {
                const label = el('label'), box = el('input');
                box.type = 'checkbox'; box.checked = !filter.hidden.has(name);
                box.addEventListener('change', () => {
                    if (box.checked) filter.hidden.delete(name); else filter.hidden.add(name);
                    syncAll(); onGroupChange(state);
                });
                label.append(box, doc.createTextNode(name));
                filter.panel.append(label);
                return box;
            });
            function syncAll() {
                const checked = boxes.filter(box => box.checked).length;
                all.checked = checked === boxes.length;
                all.indeterminate = checked > 0 && checked < boxes.length;
            }
            all.addEventListener('change', () => {
                filter.groups.forEach(name => { if (all.checked) filter.hidden.delete(name); else filter.hidden.add(name); });
                boxes.forEach(box => { box.checked = all.checked; });

            });

        function onGroupChange(state) {

        function makeDisplayToggles(state, label, items) {

                && (!state.selects.age.value || row.age_band === state.selects.age.value));

        async function load(state, values, force = false) {

                state.status.textContent = error.message; state.status.className = 'status error'; return false;
            }
            if (state.controller) state.controller.abort();
            const controller = new AbortController();
            state.controller = controller;
            state.error = null;
            const cacheKey = JSON.stringify([spec.url, spec.body]);
